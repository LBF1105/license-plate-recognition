# ============================================================
# 车牌识别双方案对照配置
# 所有路径相对于项目根目录
# ============================================================

# -------------------- 方案一：集成式（HyperLPR3）--------------------
integrated:
  name: HyperLPR3 集成式识别
  detect_level: high                 # 检测档位：low / high
  device: cpu                        # cpu 或 0（GPU）
  tile: false                        # true 时分块检测，提升大图中远处小车牌的召回
  tile_grid: [3, 2]                  # 分块网格：[横向块数, 纵向块数]
  overlap: 0.15                      # 分块重叠比例，避免车牌被切在边界上

# -------------------- 方案二：分步式（YOLO + LPRNet）--------------------
two_stage:
  name: YOLO + LPRNet 分步式识别
  detector:
    weights: weights/plate_detect.pt # YOLO 车牌检测权重
    conf_threshold: 0.25             # 置信度阈值
    iou_threshold: 0.45              # NMS IoU 阈值
    device: cpu
  recognizer:
    weights: weights/lprnet.pth      # LPRNet 字符识别权重
    device: cpu

# -------------------- 公共路径 --------------------
paths:
  test_images: data/test_images
  output:
    integrated: output/integrated
    two_stage: output/two_stage
    comparison: output/comparison

# -------------------- 车牌规则 --------------------
plate:
  blue_plate_length: 7               # 普通蓝牌/黄牌字符数
  green_plate_length: 8              # 新能源绿牌字符数
